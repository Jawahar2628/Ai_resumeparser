name: Deploy Resume Parser Backend

on:
  push:
    branches:
      - development

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Upload Backend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "server-backend/*"
          target: "/root/ai_resume/Ai_resumeparser"
          strip_components: 1
          overwrite: true

      - name: Install Dependencies & Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /root/ai_resume/Ai_resumeparser/server-backend

            # Create virtual environment if it doesn't exist
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi

            # Activate virtual environment
            source venv/bin/activate

            # Install dependencies
            pip install --upgrade pip
            pip install -r requirements.txt

            # Full path to PM2
            PM2="/root/.nvm/versions/node/v20.20.2/bin/pm2"

            # Restart application
            $PM2 delete python-app || true

            $PM2 start ./venv/bin/uvicorn \
              --interpreter none \
              --name python-app \
              -- app.main:app \
              --host 0.0.0.0 \
              --port 8012

            # Save PM2 process list
            $PM2 save

            # Reload Nginx
            sudo systemctl reload nginx
